# This is a basic workflow to help you get started with Actions
name: deploy pipeline

# Controls when the action will run. Invokes the workflow on push events but only for the main branch
on:
  workflow_run:
    workflows: [Application pipeline]
    types:
      - completed
    
env:
  
  AWS_REGION : "eu-west-2" #Change to reflect your Region

# Permission can be added at job level or workflow level    
permissions:
      id-token: write   # This is required for requesting the JWT
      contents: read    # This is required for actions/checkout
jobs:  
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo 'The triggering workflow passed'  

      - name: Git clone the repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: arn:aws:iam::296222413273:role/ecs-github-actions #change to reflect your IAM role’s ARN
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
  
      - name: setup-terraform
        uses: hashicorp/setup-terraform@v4 
        
      - name: terraform init  
        run: terraform init
        working-directory: infra
      
      - name: terraform validate
        run: terraform validate
        working-directory: infra
      
      - name: terraform plan 
        run: terraform plan -var="image_tag=${{ github.event.workflow_run.head_sha }}" -out=FILE
        working-directory: infra

      - name: terraform apply  
        run: terraform apply FILE
        working-directory: infra





        
